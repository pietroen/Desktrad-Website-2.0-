name: Inject global localization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject localization script into all HTML pages
        run: python tools/inject-localization.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "nobo tesste"/*.html
          git commit -m "Apply global localization to all pages [skip ci]"
          git push
